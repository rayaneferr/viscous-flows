[project]
name = "viscous-flows"
version = "0.1.0"
description = "Viscous flows: momentum diffusion (Stokes/Couette), Hagen-Poiseuille pipe flow, and head losses via a computed Moody diagram."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pillow>=10.0",
    "scipy>=1.14",
]
